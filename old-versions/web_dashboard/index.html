<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadGuardian V2 - Dashboard</title>
  
  <!-- Config must be loaded first -->
  <script src="config.js"></script>
  
  <!-- Google Maps API -->
  <script async defer 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDemoKeyForTestingOnly&libraries=visualization">
  </script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden">
  <!-- API Status Banner -->
  <div id="apiStatusBanner" class="hidden fixed top-0 left-0 right-0 z-50 bg-yellow-900 text-yellow-200 px-4 py-2 text-sm">
    <div class="container mx-auto flex items-center justify-between">
      <span id="apiStatusMessage">Loading...</span>
      <button onclick="dismissBanner()" class="ml-4 text-yellow-300 hover:text-yellow-100">×</button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="flex h-full pt-0">
    <!-- Map Section (Left) -->
    <div class="flex-1 relative">
      <div id="map" class="w-full h-full"></div>
      
      <!-- Map Controls Overlay -->
      <div class="absolute top-4 left-4 bg-gray-800 rounded-lg shadow-lg p-2 space-y-2">
        <button id="heatmapToggle" class="block w-full px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-sm transition">
          Heatmap
        </button>
        <button id="exportBtn" class="block w-full px-3 py-1 bg-green-600 hover:bg-green-700 rounded text-sm transition">
          Export
        </button>
      </div>
    </div>

    <!-- Sidebar (Right) -->
    <div class="w-96 bg-gray-800 border-l border-gray-700 flex flex-col">
      <!-- Header -->
      <div class="p-4 border-b border-gray-700">
        <h1 class="text-xl font-bold text-white">RoadGuardian Dashboard</h1>
        <p class="text-gray-400 text-sm mt-1">Incident Management System</p>
      </div>

      <!-- API Status Widget -->
      <div class="p-4 bg-gray-900 border-b border-gray-700">
        <h3 class="text-sm font-semibold text-gray-300 mb-2">System Status</h3>
        <div class="space-y-1 text-xs">
          <div class="flex justify-between">
            <span>Maps:</span>
            <span id="mapsStatus" class="font-mono">Checking...</span>
          </div>
          <div class="flex justify-between">
            <span>Firebase:</span>
            <span id="firebaseStatus" class="font-mono">Checking...</span>
          </div>
          <div class="flex justify-between">
            <span>Firestore:</span>
            <span id="firestoreStatus" class="font-mono">Checking...</span>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="p-4 border-b border-gray-700">
        <h3 class="text-sm font-semibold text-gray-300 mb-2">Filters</h3>
        <div class="space-y-2">
          <select id="ageFilter" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm">
            <option value="">All Time</option>
            <option value="2h">Last 2 Hours</option>
            <option value="24h">Last 24 Hours</option>
            <option value="7d">Last 7 Days</option>
          </select>
          <select id="statusFilter" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm">
            <option value="">All Status</option>
            <option value="unclaimed">Unclaimed</option>
            <option value="claimed">Claimed</option>
            <option value="handled">Handled</option>
            <option value="verified">Verified</option>
          </select>
        </div>
      </div>

      <!-- Incidents List -->
      <div class="flex-1 overflow-y-auto p-4">
        <h3 class="text-sm font-semibold text-gray-300 mb-2">Incidents</h3>
        <div id="incidentsList" class="space-y-2">
          <!-- Incidents will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Incident Detail Modal -->
  <div id="incidentModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-lg max-w-2xl w-full max-h-[80vh] overflow-y-auto">
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <h2 class="text-xl font-bold text-white">Incident Details</h2>
          <button onclick="closeIncidentModal()" class="text-gray-400 hover:text-white">×</button>
        </div>
        <div id="incidentDetails">
          <!-- Details will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
