<!DOCTYPE html>
<html>
<head>
    <title>Admin Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form { max-width: 400px; margin: 0 auto; }
        .field { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="form">
        <h2>Admin Login Test</h2>
        <div class="field">
            <label>Email:</label>
            <input type="email" id="email" value="admin@puten-pazitel.local">
        </div>
        <div class="field">
            <label>Password:</label>
            <input type="password" id="password" value="admin123">
        </div>
        <button onclick="login()">Login</button>
        <div id="result"></div>
        <div id="debug"></div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const debugDiv = document.getElementById('debug');
            
            try {
                const response = await fetch('http://localhost:3333/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">Login successful!</div>';
                    localStorage.setItem('roadguardian_token', data.token);
                    localStorage.setItem('roadguardian_user', JSON.stringify(data.user));
                    
                    debugDiv.innerHTML = `
                        <h3>Debug Info:</h3>
                        <p>Token: ${data.token}</p>
                        <p>User: ${JSON.stringify(data.user, null, 2)}</p>
                        <p><a href="dashboard.html">Go to Dashboard</a></p>
                        <p><a href="test.html">Check localStorage</a></p>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">Login failed: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
